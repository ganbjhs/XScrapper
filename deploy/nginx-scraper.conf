# certbot rewrites this to add the TLS block and an HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name scraper.vedictech.in;

    # Requests can take a while: a 25-page fetch is 25 sequential calls to X.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The dashboard serves your own collected data; nothing here should be
    # framed by another site or sniffed into a different content type.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The app trusts this ONLY because --behind-proxy is set, and nginx
        # overwrites whatever the client sent. Login lockout counts real IPs.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
