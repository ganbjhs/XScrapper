# The scraper's nginx server block.
#
# INSTALLED ONCE, THEN OWNED BY CERTBOT. setup.sh writes this file only if it
# does not already exist, because `certbot --nginx` edits it in place to add
# the TLS block and a separate :80 redirect. Copying this template over a
# certbot-managed file deletes the HTTPS configuration — and the symptom is
# nasty: the site keeps answering on port 80 while HTTPS falls through to
# whatever other app on the box owns the first SSL block, presenting that
# app's certificate. Every browser then shows a certificate-name mismatch, on
# a domain that looks perfectly healthy over HTTP.
#
# Everything that DOES change between deploys — the proxy target, the port,
# the headers — lives in the snippet included below, which setup.sh rewrites
# on every run. Keeping the two apart is what makes re-running safe.
#
# __DOMAIN__ is substituted by setup.sh.

server {
    listen 80;
    listen [::]:80;

    # Exactly one name, and never `default_server`. This block answers for this
    # host and nothing else; claiming the default would make it swallow
    # requests meant for other sites on this machine.
    server_name __DOMAIN__;

    include snippets/xscraper-app.conf;
}
