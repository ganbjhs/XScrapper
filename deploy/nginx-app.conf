# How nginx talks to the dashboard. Included by the server block.
#
# REWRITTEN ON EVERY setup.sh RUN, which is safe precisely because there is no
# `server` or `listen` line in here — certbot's TLS edits live in the vhost
# file and are never touched. This is the half that is allowed to change.
#
# __PORT__ is substituted by setup.sh with the port the service actually got.

# Requests can take a while: asking X for 25 pages is 25 calls in sequence.
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Tell the browser never to try plain HTTP for this host again. Without it the
# FIRST request of every visit still goes out in cleartext before the redirect
# answers — including whatever session cookie is already set.
#
# Browsers ignore this header when it arrives over plain HTTP, so it is inert
# until certbot has run and harmless if it has not.
add_header Strict-Transport-Security "max-age=31536000" always;

# This serves your own collected data. Nothing here should be framed by another
# site or sniffed into a different content type.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;

location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # The app trusts this ONLY because --behind-proxy is set, and nginx
    # overwrites whatever the client sent. Login lockout counts real IPs.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A sign-in window streams a screenshot roughly once a second and forwards
    # every keystroke. Buffering those would make the remote browser feel broken.
    proxy_buffering off;
}
